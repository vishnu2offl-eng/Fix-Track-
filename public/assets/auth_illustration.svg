<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" width="100%" height="100%" fill="none">
  <!-- Subtle circular backdrop -->
  <circle cx="280" cy="225" r="165" fill="#F0F4F2" />
  
  <!-- Subtle ground shadow -->
  <ellipse cx="245" cy="425" rx="180" ry="10" fill="#E8EDF0" />

  <!-- 7 Vertical Bars (Brand Slate #263336) -->
  <rect x="85"  y="255" width="23" height="155" rx="7" fill="#263336" />
  <rect x="117" y="215" width="23" height="195" rx="7" fill="#263336" />
  <rect x="149" y="175" width="23" height="235" rx="7" fill="#263336" />
  <rect x="181" y="140" width="23" height="270" rx="7" fill="#263336" />
  <rect x="213" y="105" width="23" height="305" rx="7" fill="#263336" />
  <rect x="245" y="225" width="23" height="185" rx="7" fill="#263336" />
  <rect x="277" y="285" width="23" height="125" rx="7" fill="#263336" />

  <!-- Archery Target (Top-Left above Bars) -->
  <g transform="translate(108, 170)">
    <!-- Outer gold ring -->
    <circle cx="0" cy="0" r="33" fill="none" stroke="#CCA056" stroke-width="6.5" />
    <!-- White space -->
    <circle cx="0" cy="0" r="26.5" fill="none" stroke="#FFFFFF" stroke-width="4.5" />
    <!-- Slate inner ring -->
    <circle cx="0" cy="0" r="21" fill="none" stroke="#263336" stroke-width="7" />
    <!-- White space -->
    <circle cx="0" cy="0" r="14" fill="#FFFFFF" />
    <!-- Center bullseye -->
    <circle cx="0" cy="0" r="6.5" fill="#263336" />
    <!-- Arrow -->
    <line x1="-28" y1="-28" x2="-3" y2="-3" stroke="#CCA056" stroke-width="3" stroke-linecap="round" />
    <path d="M -23,-30 L -30,-30 L -30,-23" fill="none" stroke="#CCA056" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M -18,-27 L -27,-18" stroke="#CCA056" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Sparkles / Star around target -->
  <path d="M 90 120 Q 94 125 100 125 Q 94 125 90 130 Q 86 125 80 125 Q 86 125 90 120 Z" fill="#CCA056" />
  <circle cx="75" cy="140" r="3.5" fill="#E8D5B5" />

  <!-- Coin with $ and Rocket above Bar 3 -->
  <g transform="translate(162, 130)">
    <!-- Dark circular coin with dollar -->
    <circle cx="0" cy="0" r="13" fill="#263336" />
    <circle cx="0" cy="0" r="11" fill="none" stroke="#E2E8F0" stroke-width="1" />
    <text x="0" y="4.5" fill="#FFFFFF" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">$</text>
  </g>
  <!-- Rocket bursting upwards -->
  <g transform="translate(172, 185) rotate(-15)">
    <!-- Flame -->
    <path d="M -4 14 C -6 22, -1 25, 0 28 C 1 25, 6 22, 4 14 Z" fill="#D97706" />
    <path d="M -2 14 C -3 18, 0 20, 0 22 C 0 20, 3 18, 2 14 Z" fill="#FCD34D" />
    <!-- Rocket body -->
    <path d="M 0 -18 C -7 -6, -8 10, -7 14 L 7 14 C 8 10, 7 -6, 0 -18 Z" fill="#FFFFFF" stroke="#263336" stroke-width="2.5" />
    <!-- Fins -->
    <path d="M -7 6 L -13 14 L -7 13 Z" fill="#263336" />
    <path d="M 7 6 L 13 14 L 7 13 Z" fill="#263336" />
    <!-- Window -->
    <circle cx="0" cy="-2" r="3" fill="#263336" />
  </g>

  <!-- Person / Character jumping down onto Bar 6 -->
  <g transform="translate(268, 235)">
    <!-- Head -->
    <circle cx="0" cy="-45" r="9" fill="#FDE8D7" />
    <!-- Hair -->
    <path d="M -9 -47 C -9 -55, 9 -55, 9 -47 C 6 -52, -4 -52, -9 -47 Z" fill="#263336" />
    <!-- Arms -->
    <line x1="0" y1="-26" x2="-22" y2="-28" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="-23" cy="-28" r="2.5" fill="#CCA056" />
    <line x1="0" y1="-26" x2="20" y2="-22" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="21" cy="-22" r="2.5" fill="#CCA056" />
    <!-- Shirt -->
    <path d="M -7 -36 L 7 -36 L 9 -12 L -9 -12 Z" fill="#FFFFFF" />
    <!-- Legs (Slate #263336) -->
    <path d="M -4 -12 L -9 8 L -14 26" fill="none" stroke="#263336" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 4 -12 L 12 6 L 24 10" fill="none" stroke="#263336" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Feet -->
    <ellipse cx="-15" cy="27" rx="3.5" ry="2" fill="#263336" />
    <ellipse cx="25" cy="10" rx="3.5" ry="2" fill="#263336" />
  </g>

  <!-- Green Checkmark Badge -->
  <g transform="translate(295, 170)">
    <circle cx="0" cy="0" r="11" fill="none" stroke="#38A169" stroke-width="2.5" />
    <path d="M -4 0 L -1 3 L 4 -3" fill="none" stroke="#38A169" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Donut Chart (Right of character) -->
  <g transform="translate(378, 240)">
    <!-- Background faint ring -->
    <circle cx="0" cy="0" r="32" fill="none" stroke="#DCE5EB" stroke-width="2" />
    <!-- Donut ring -->
    <!-- Gold 25% slice -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="#CCA056" stroke-width="10" stroke-dasharray="32 100" stroke-dashoffset="0" />
    <!-- Dark slate 75% slice -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="#263336" stroke-width="10" stroke-dasharray="88 100" stroke-dashoffset="-34" />
  </g>
  <!-- Small sparkles & dots on right -->
  <path d="M 408 275 Q 410 278 414 278 Q 410 278 408 281 Q 406 278 402 278 Q 406 278 408 275 Z" fill="#8B9AA0" />
  <circle cx="400" cy="115" r="3.5" fill="#CBD5E1" />
</svg>