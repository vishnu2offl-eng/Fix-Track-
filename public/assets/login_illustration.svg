<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" width="100%" height="100%" fill="none">
  <!-- Subtle floor shadow ellipse -->
  <ellipse cx="250" cy="275" rx="195" ry="18" fill="#E8ECE9" />

  <!-- Left: Houseplant in pot -->
  <g transform="translate(130, 245)">
    <!-- Tapered Ceramic Pot -->
    <path d="M -16 0 L 16 0 L 12 36 L -12 36 Z" fill="#B8C9CF" />
    <ellipse cx="0" cy="0" rx="16" ry="3" fill="#A4B7BD" />
    <!-- Plant Leaves (Deep forest green #294930) -->
    <path d="M -3 -1 C -18 -15, -24 -38, -14 -50 C -4 -42, 2 -25, 0 -1 Z" fill="#294930" />
    <path d="M 0 -2 C 2 -25, 12 -44, 22 -46 C 24 -35, 16 -18, 3 -2 Z" fill="#3D6847" />
    <path d="M -2 -1 C -6 -25, -2 -50, 4 -58 C 8 -46, 7 -22, 1 -1 Z" fill="#2F5338" />
  </g>

  <!-- Wall Frame with Sun Icon (Above Plant) -->
  <g transform="translate(130, 108)">
    <rect x="-19" y="-19" width="38" height="38" rx="10" fill="#263336" />
    <!-- Sun icon -->
    <circle cx="0" cy="0" r="6" fill="#FDFBF7" />
    <!-- 8 rays -->
    <line x1="0" y1="-10" x2="0" y2="-13" stroke="#FDFBF7" stroke-width="2" stroke-linecap="round" />
    <line x1="0" y1="10" x2="0" y2="13" stroke="#FDFBF7" stroke-width="2" stroke-linecap="round" />
    <line x1="-10" y1="0" x2="-13" y2="0" stroke="#FDFBF7" stroke-width="2" stroke-linecap="round" />
    <line x1="10" y1="0" x2="13" y2="0" stroke="#FDFBF7" stroke-width="2" stroke-linecap="round" />
    <line x1="-7" y1="-7" x2="-9" y2="-9" stroke="#FDFBF7" stroke-width="2" stroke-linecap="round" />
    <line x1="7" y1="7" x2="9" y2="9" stroke="#FDFBF7" stroke-width="2" stroke-linecap="round" />
    <line x1="-7" y1="7" x2="-9" y2="9" stroke="#FDFBF7" stroke-width="2" stroke-linecap="round" />
    <line x1="7" y1="-7" x2="9" y2="-9" stroke="#FDFBF7" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Center: Stool & Resident Character -->
  <g transform="translate(235, 200)">
    <!-- Minimalist Stool (Slate #263336) -->
    <line x1="0" y1="20" x2="-24" y2="68" stroke="#263336" stroke-width="4.5" stroke-linecap="round" />
    <line x1="0" y1="20" x2="24" y2="68" stroke="#263336" stroke-width="4.5" stroke-linecap="round" />
    <line x1="0" y1="20" x2="2" y2="68" stroke="#263336" stroke-width="3.5" stroke-linecap="round" />
    <ellipse cx="0" cy="20" rx="18" ry="4" fill="#263336" />

    <!-- Legs (Dark slate trousers) -->
    <path d="M -8 18 L -32 70" stroke="#263336" stroke-width="11" stroke-linecap="round" />
    <path d="M 8 18 L 30 70" stroke="#263336" stroke-width="11" stroke-linecap="round" />

    <!-- White sneakers with blue/grey sole -->
    <ellipse cx="-35" cy="74" rx="11" ry="5.5" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1" />
    <ellipse cx="33" cy="74" rx="11" ry="5.5" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1" />

    <!-- Torso / White t-shirt with dark crew straps -->
    <path d="M -14 -32 C -14 -10, -18 18, -12 22 L 12 22 C 18 18, 14 -10, 14 -32 Z" fill="#FFFFFF" />
    <path d="M -14 -32 C -8 -20, -12 10, -10 22" fill="none" stroke="#263336" stroke-width="2.5" />
    <path d="M 14 -32 C 8 -20, 12 10, 10 22" fill="none" stroke="#263336" stroke-width="2.5" />
    <path d="M -7 -32 C -3 -26, 3 -26, 7 -32" fill="none" stroke="#263336" stroke-width="3" stroke-linecap="round" />

    <!-- Golden amber laptop sleeve / folder (#CCA056 / #C28E40) -->
    <rect x="-6" y="-6" width="48" height="34" rx="6" fill="#CCA056" />
    <path d="M -8 24 L 44 24" stroke="#A87E34" stroke-width="2.5" stroke-linecap="round" />

    <!-- Arms & Hands holding folder -->
    <path d="M -13 -26 C -8 -10, -3 8, 8 12" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" />
    <circle cx="8" cy="12" r="4.5" fill="#FDE8D7" />
    <path d="M 13 -26 C 18 -10, 18 2, 14 12" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" />
    <circle cx="14" cy="12" r="4.5" fill="#FDE8D7" />

    <!-- Head & Hair -->
    <circle cx="0" cy="-52" r="14" fill="#FDE8D7" />
    <path d="M -14 -54 C -14 -68, 12 -68, 14 -54 C 10 -64, -6 -64, -14 -54 Z" fill="#263336" />
  </g>

  <!-- Right: Tall whiteboard partition with standing lamp -->
  <g transform="translate(365, 175)">
    <!-- Whiteboard Frame -->
    <rect x="-38" y="-75" width="76" height="115" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2.5" />
    <!-- Shaded lower section -->
    <rect x="-36" y="-12" width="72" height="50" rx="6" fill="#E8ECE9" />
    <!-- Base clips / stand clips -->
    <rect x="-24" y="38" width="48" height="4" rx="2" fill="#CBD5E1" />

    <!-- Lamp neck curving from top -->
    <path d="M -12 -75 C -12 -100, 10 -115, 24 -96" fill="none" stroke="#263336" stroke-width="4.5" stroke-linecap="round" />
    <!-- Connector -->
    <ellipse cx="-12" cy="-75" rx="10" ry="3.5" fill="#C5D3D9" />
    <!-- Amber Lamp Shade (#CCA056) -->
    <ellipse cx="30" cy="-94" rx="16" ry="8.5" fill="#CCA056" />
    <ellipse cx="30" cy="-93" rx="12" ry="5.5" fill="#DFB76C" opacity="0.8" />
  </g>
</svg>